<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Front-End Switcher | Celeste Photo Studio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎛️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,300;6..96,400;6..96,500&family=Jost:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f7f5f1;font-family:"Jost",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:#3a4054;text-decoration:none}
  a:hover{color:#8a6d1f}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit}
  @keyframes vfade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .hover-invert-dark:hover{background:#22242c!important;color:#f7f5f1!important;border-color:#22242c!important}
  .hover-gold:hover{background:#d4af37!important;color:#0f1115!important}
  .hover-border-light:hover{border-color:#f0f2f5!important}
  .hover-bg-cream:hover{background:#f7f5f1!important}
  .hover-border-dark:hover{border-color:#22242c!important}
  .hover-border-gold:hover{border-color:#d4af37!important}
  .hover-bg-dark:hover{background:#22242c!important}
  .hover-bg-dark-text-light:hover{background:#22242c!important;color:#e8e6e0!important}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
const PHOTOS = [
  { src: "https://images.unsplash.com/photo-1566577739112-5180d4bf9390?auto=format&fit=crop&w=1200&q=80", alt: "Friday night football, sideline", title: "Sideline, 4th quarter", ref: "CP-0412", meta: "Sport / 2025", price: "$60 – $290", note: "Friday night, fourth quarter. Available light, ISO 6400." },
  { src: "https://images.unsplash.com/photo-1519861531473-9200262188bf?auto=format&fit=crop&w=1200&q=80", alt: "Outdoor league, second period", title: "Second period", ref: "CP-0388", meta: "Sport / 2025", price: "$60 – $290", note: "Shawnee Park summer league, tip of the second period." },
  { src: "https://images.unsplash.com/photo-1758147313461-2ddce195ed50?auto=format&fit=crop&w=1200&q=80", alt: "Memorial procession", title: "Procession", ref: "CP-0501", meta: "Community / 2026", price: "$60 – $290", note: "Memorial procession, hand raised as the float passes." },
  { src: "https://images.unsplash.com/photo-1511898634545-c01af8a54dd5?auto=format&fit=crop&w=1200&q=80", alt: "Riverfront demonstration", title: "Riverfront", ref: "CP-0466", meta: "Protest / 2025", price: "$60 – $290", note: "Riverfront demonstration, late afternoon, wide frame." },
  { src: "https://images.unsplash.com/photo-1583407723467-9b2d22504831?auto=format&fit=crop&w=1200&q=80", alt: "Street placard", title: "Placard", ref: "CP-0473", meta: "Protest / 2025", price: "$60 – $290", note: "Main Street, a placard carried between marches." }
];

const LABELS = { ethereal: "Editorial", cinematic: "Cinematic", archive: "Archive", portal: "Portal" };

const state = {
  view: "site", preset: "ethereal", published: "ethereal",
  about: true, services: true, shop: true,
  loggedIn: false, tab: "gallery",
  favs: new Set(["CP-0412-03", "CP-0388-05", "CP-0501-01"]),
  sel: 0, option: "16×20 print", optionPrice: "$145",
  cart: 2, cartTotal: "$205.00"
};

function setState(patch) {
  Object.assign(state, patch);
  render();
}

function gallery() {
  const out = [];
  for (let i = 0; i < 12; i++) {
    const p = PHOTOS[i % PHOTOS.length];
    const ref = p.ref + "-" + String(i + 1).padStart(2, "0");
    out.push({ src: p.src, ref, fav: state.favs.has(ref) });
  }
  return out;
}

function archiveItems() {
  return PHOTOS.concat(PHOTOS).map((p, i) => ({ src: p.src, title: p.title, ref: p.ref + "-" + (i + 1) }));
}

const ACTIONS = {
  goSite: () => setState({ view: "site" }),
  goClient: () => setState({ view: "client" }),
  goShop: () => setState({ view: "shop" }),
  goAdmin: () => setState({ view: "admin" }),
  goBook: () => {
    requestAnimationFrame(() => {
      const el = document.getElementById("book") || document.getElementById("work");
      if (el) window.scrollTo({ top: el.offsetTop, behavior: "smooth" });
    });
  },
  setEthereal: () => setState({ preset: "ethereal" }),
  setCinematic: () => setState({ preset: "cinematic" }),
  setArchive: () => setState({ preset: "archive" }),
  setPortal: () => setState({ preset: "portal" }),
  toggleAbout: () => setState({ about: !state.about }),
  toggleServices: () => setState({ services: !state.services }),
  toggleShop: () => setState({ shop: !state.shop }),
  publish: () => setState({ published: state.preset }),
  login: () => setState({ loggedIn: true }),
  logout: () => setState({ loggedIn: false, tab: "gallery" }),
  tabGallery: () => setState({ tab: "gallery" }),
  tabFavs: () => setState({ tab: "favs" }),
  tabProofs: () => setState({ tab: "proofs" }),
  tabInvoice: () => setState({ tab: "invoice" }),
  toggleFav: (ds) => {
    const favs = new Set(state.favs);
    favs.has(ds.ref) ? favs.delete(ds.ref) : favs.add(ds.ref);
    setState({ favs });
  },
  pickShopItem: (ds) => setState({ sel: Number(ds.idx) }),
  pickSize: (ds) => setState({ option: ds.option, optionPrice: ds.price }),
  addToCart: () => setState({ cart: state.cart + 1 })
};

function renderEthereal() {
  return `
  <div style="background:#f7f5f1;animation:vfade .5s ease both">
    <header style="display:flex;justify-content:space-between;align-items:center;padding:26px 48px">
      <div style="font-family:'Bodoni Moda',serif;font-size:15px;letter-spacing:.34em;text-transform:uppercase;color:#22242c">Celeste</div>
      <nav style="display:flex;gap:30px;align-items:center">
        <a href="#work" style="font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:#6b6f7d">Work</a>
        <a href="#about" style="font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:#6b6f7d">About</a>
        <a href="#services" style="font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:#6b6f7d">Services</a>
        ${state.shop ? `<button data-action="goShop" style="background:none;border:0;padding:0;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:#6b6f7d">Prints</button>` : ""}
        <button data-action="goClient" class="hover-invert-dark" style="background:none;border:1px solid #c9c3b8;border-radius:2px;padding:8px 16px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#22242c">Client Login</button>
      </nav>
    </header>

    <section style="display:grid;grid-template-columns:150px 1fr 92px;gap:0;align-items:stretch;padding:0 48px;min-height:560px">
      <div style="display:flex;flex-direction:column;gap:14px;padding-top:26px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;color:#a9a49a">
        <div>01</div>
        <div style="display:flex;align-items:center;gap:9px;color:#22242c"><span style="width:6px;height:6px;border-radius:50%;background:#22242c"></span>02</div>
        <div>03</div><div>04</div><div>05</div>
      </div>
      <div style="position:relative;overflow:hidden">
        <img src="${PHOTOS[0].src}" alt="Friday night football, sideline" style="width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block;filter:saturate(.78) contrast(1.03)">
        <div style="position:absolute;inset:0;background:linear-gradient(180deg,#f7f5f1 0%,rgba(247,245,241,.55) 22%,rgba(247,245,241,0) 55%)"></div>
      </div>
      <div style="display:flex;flex-direction:column;justify-content:center;gap:10px;padding-left:16px">
        <img src="${PHOTOS[1].src}" alt="" style="width:56px;height:56px;object-fit:cover;border-radius:50%">
        <img src="${PHOTOS[2].src}" alt="" style="width:56px;height:56px;object-fit:cover;border-radius:50%">
        <img src="${PHOTOS[3].src}" alt="" style="width:56px;height:56px;object-fit:cover;border-radius:50%">
        <div style="writing-mode:vertical-rl;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:#a9a49a;margin-top:12px">Recent frames</div>
      </div>
    </section>

    <section style="display:grid;grid-template-columns:1fr 300px 74px;gap:36px;align-items:end;padding:34px 48px 64px">
      <h1 style="margin:0;font-family:'Bodoni Moda',serif;font-weight:300;font-size:clamp(48px,7.4vw,112px);line-height:.9;letter-spacing:.04em;color:#22242c;text-transform:uppercase">Documentary<span style="color:#8a6d1f">.</span></h1>
      <p style="margin:0;font-size:13.5px;line-height:1.75;color:#6b6f7d;text-wrap:pretty">Sport, protest and public life in Louisville — photographed as it happens, printed as it was seen. Booking sessions and assignments for 2026.</p>
      <button data-action="goBook" class="hover-invert-dark" style="width:74px;height:74px;border-radius:50%;border:1px solid #22242c;background:none;color:#22242c;font-size:19px">&#8599;</button>
    </section>

    <section id="work" style="background:#3a4054;padding:78px 48px 90px;color:#e8e6e0">
      <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:40px;margin-bottom:44px">
        <div style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#a3a8b8">Selected work<br>2024 &ndash; 2026</div>
        <h2 style="margin:0;font-family:'Bodoni Moda',serif;font-weight:300;font-size:clamp(40px,5.6vw,84px);line-height:.92;letter-spacing:.05em;text-transform:uppercase">The Work</h2>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:end">
        <figure style="margin:0;display:flex;flex-direction:column;gap:10px"><img src="${PHOTOS[1].src}" alt="Outdoor league, second period" style="width:100%;height:300px;object-fit:cover;display:block"><figcaption style="font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#a3a8b8">Shawnee Park &middot; League</figcaption></figure>
        <figure style="margin:0;display:flex;flex-direction:column;gap:10px"><img src="${PHOTOS[2].src}" alt="Memorial procession" style="width:100%;height:360px;object-fit:cover;display:block"><figcaption style="font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#a3a8b8">Memorial procession</figcaption></figure>
        <figure style="margin:0;display:flex;flex-direction:column;gap:10px"><img src="${PHOTOS[3].src}" alt="Riverfront demonstration" style="width:100%;height:262px;object-fit:cover;display:block"><figcaption style="font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#a3a8b8">Riverfront &middot; Demonstration</figcaption></figure>
        <figure style="margin:0;display:flex;flex-direction:column;gap:10px"><img src="${PHOTOS[4].src}" alt="Street placard" style="width:100%;height:330px;object-fit:cover;display:block"><figcaption style="font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#a3a8b8">Main Street &middot; Placard</figcaption></figure>
      </div>
    </section>
  </div>`;
}

function renderCinematicHero() {
  return `
  <div style="background:#0f1115;color:#f0f2f5;animation:vfade .5s ease both">
    <div style="position:relative;height:calc(100vh - 96px);min-height:600px;overflow:hidden">
      <img src="${PHOTOS[2].src}" alt="Memorial procession" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 45%">
      <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,17,21,.72) 0%,rgba(15,17,21,.15) 40%,rgba(15,17,21,.92) 100%)"></div>
      <header style="position:relative;display:flex;justify-content:space-between;align-items:center;padding:26px 44px">
        <div style="font-family:'Bodoni Moda',serif;font-size:15px;letter-spacing:.34em;text-transform:uppercase">Celeste</div>
        <nav style="display:flex;gap:28px;align-items:center">
          <a href="#c-about" style="font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:#9ba3af">About</a>
          <a href="#c-services" style="font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:#9ba3af">Services</a>
          ${state.shop ? `<button data-action="goShop" style="background:none;border:0;padding:0;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:#9ba3af">Prints</button>` : ""}
          <button data-action="goClient" class="hover-gold" style="background:none;border:1px solid #d4af37;border-radius:3px;padding:8px 16px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#d4af37">Client Login</button>
        </nav>
      </header>
      <div style="position:absolute;left:44px;right:44px;bottom:46px;display:grid;grid-template-columns:1fr auto;gap:40px;align-items:end">
        <div style="display:flex;flex-direction:column;gap:18px;max-width:760px">
          <div style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#d4af37">Frame 02 &mdash; Memorial procession, June</div>
          <h1 style="margin:0;font-family:'Bodoni Moda',serif;font-weight:300;font-size:clamp(44px,6.4vw,92px);line-height:.94;letter-spacing:.03em">The picture is the whole argument.</h1>
          <div style="display:flex;gap:12px;margin-top:6px">
            <button data-action="goBook" style="background:#d4af37;border:0;border-radius:3px;padding:14px 28px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#0f1115;font-weight:500">Book a session</button>
            <button data-action="goShop" class="hover-border-light" style="background:none;border:1px solid rgba(240,242,245,.4);border-radius:3px;padding:14px 28px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#f0f2f5">View prints</button>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:11px;align-items:flex-end">
          <span style="width:34px;height:2px;background:rgba(240,242,245,.3)"></span>
          <span style="width:34px;height:2px;background:#d4af37"></span>
          <span style="width:34px;height:2px;background:rgba(240,242,245,.3)"></span>
          <span style="width:34px;height:2px;background:rgba(240,242,245,.3)"></span>
          <span style="width:34px;height:2px;background:rgba(240,242,245,.3)"></span>
        </div>
      </div>
    </div>
    <section style="padding:70px 44px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px">
      <img src="${PHOTOS[0].src}" alt="Friday night football" style="width:100%;height:280px;object-fit:cover;display:block">
      <img src="${PHOTOS[3].src}" alt="Riverfront demonstration" style="width:100%;height:280px;object-fit:cover;display:block">
      <img src="${PHOTOS[1].src}" alt="Outdoor league" style="width:100%;height:280px;object-fit:cover;display:block">
    </section>
  </div>`;
}

function renderArchive() {
  const items = archiveItems().map(it => `
        <figure style="margin:0;background:#22242c;position:relative">
          <img src="${it.src}" alt="${it.title}" style="width:100%;aspect-ratio:1/1;object-fit:cover;display:block">
          <figcaption style="position:absolute;left:0;right:0;bottom:0;padding:9px 10px;background:linear-gradient(180deg,rgba(34,36,44,0),rgba(34,36,44,.88));font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#e8e6e0;display:flex;justify-content:space-between;gap:8px">
            <span>${it.title}</span><span style="color:#a9a49a">${it.ref}</span>
          </figcaption>
        </figure>`).join("");

  return `
  <div style="background:#ece8e1;animation:vfade .5s ease both">
    <header style="display:flex;justify-content:space-between;align-items:center;padding:22px 34px;border-bottom:1px solid #d5cfc4">
      <div style="display:flex;align-items:baseline;gap:14px">
        <span style="font-family:'Bodoni Moda',serif;font-size:15px;letter-spacing:.3em;text-transform:uppercase;color:#22242c">Celeste</span>
        <span style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;color:#8d887d">ARCHIVE / 214 FRAMES</span>
      </div>
      <nav style="display:flex;gap:22px;align-items:center">
        <a href="#a-about" style="font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#6b6f7d">About</a>
        <a href="#a-services" style="font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#6b6f7d">Rates</a>
        ${state.shop ? `<button data-action="goShop" style="background:none;border:0;padding:0;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#6b6f7d">Prints</button>` : ""}
        <button data-action="goClient" style="background:#22242c;border:0;padding:8px 15px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#ece8e1">Client Login</button>
      </nav>
    </header>
    <div style="display:flex;gap:8px;flex-wrap:wrap;padding:20px 34px;border-bottom:1px solid #d5cfc4">
      <span style="padding:6px 13px;background:#22242c;color:#ece8e1;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase">All</span>
      <span style="padding:6px 13px;border:1px solid #c9c3b8;color:#6b6f7d;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase">Sport</span>
      <span style="padding:6px 13px;border:1px solid #c9c3b8;color:#6b6f7d;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase">Protest</span>
      <span style="padding:6px 13px;border:1px solid #c9c3b8;color:#6b6f7d;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase">Community</span>
      <span style="padding:6px 13px;border:1px solid #c9c3b8;color:#6b6f7d;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase">Portrait</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px;padding:2px">
      ${items}
    </div>
  </div>`;
}

function renderPortal() {
  return `
  <div style="background:#f7f5f1;min-height:calc(100vh - 96px);display:grid;grid-template-rows:auto 1fr auto;animation:vfade .5s ease both">
    <header style="display:flex;justify-content:space-between;align-items:center;padding:28px 44px">
      <span style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#a9a49a">Louisville, KY</span>
      <nav style="display:flex;gap:24px;align-items:center">
        ${state.shop ? `<button data-action="goShop" style="background:none;border:0;padding:0;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#a9a49a">Prints</button>` : ""}
        <button data-action="goClient" style="background:none;border:0;padding:0;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#22242c">Clients</button>
      </nav>
    </header>
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:20px">
      <img src="${PHOTOS[4].src}" alt="Street placard" style="width:min(420px,64vw);aspect-ratio:4/5;object-fit:cover;display:block">
      <h1 style="margin:0;font-family:'Bodoni Moda',serif;font-weight:300;font-size:clamp(42px,8vw,124px);line-height:.86;letter-spacing:.09em;text-transform:uppercase;color:#22242c;text-align:center">Celeste</h1>
      <p style="margin:0;max-width:420px;text-align:center;font-size:13.5px;line-height:1.8;color:#6b6f7d;text-wrap:pretty">Documentary photography. Sport, protest, and public life.</p>
      <button data-action="goBook" style="background:none;border:0;padding:0;border-bottom:1px solid #22242c;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#22242c;padding-bottom:4px">Enter the work</button>
    </div>
    <div style="padding:28px 44px;display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#a9a49a">
      <span>Est. 2019</span><span>hello@celestephoto.com</span>
    </div>
  </div>`;
}

function renderLightStack() {
  return `
  <div style="background:#f7f5f1">
    ${state.about ? `
    <section id="about" style="display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center;padding:96px 48px;max-width:1280px;margin:0 auto">
      <img src="${PHOTOS[3].src}" alt="Riverfront demonstration" style="width:100%;height:460px;object-fit:cover;display:block">
      <div style="display:flex;flex-direction:column;gap:22px">
        <div style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#a9a49a">About</div>

function renderSite() {
  let html = "<div>";
  if (state.preset === "ethereal") html += renderEthereal();
  else if (state.preset === "cinematic") html += renderCinematicHero();
  else if (state.preset === "archive") html += renderArchive();
  else if (state.preset === "portal") html += renderPortal();

  if (state.preset !== "cinematic" && state.preset !== "portal") html += renderLightStack();
  if (state.preset === "cinematic") html += renderCinematicStack();
  html += "</div>";
  return html;
}

              <textarea rows="3" placeholder="Leave a comment for Celeste" style="background:#f7f5f1;border:1px solid #ddd7cc;padding:11px 12px;font-family:inherit;font-size:13.5px;color:#22242c;resize:vertical"></textarea>
              <div style="display:flex;gap:10px">
                <button style="background:#22242c;border:0;border-radius:2px;padding:11px 20px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#f7f5f1">Approve</button>
                <button style="background:none;border:1px solid #d5cfc4;border-radius:2px;padding:11px 20px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#6b6f7d">Request changes</button>
              </div>
            </div>
          </div>
          <div style="display:grid;grid-template-columns:260px 1fr;gap:26px;background:#fff;border:1px solid #ddd7cc;padding:22px">
            <img src="${PHOTOS[0].src}" alt="Proof 2" style="width:100%;aspect-ratio:1/1;object-fit:cover;display:block">
            <div style="display:flex;flex-direction:column;gap:14px">
              <div style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#a9a49a">Proof 02 &middot; retouch v1 &middot; 21 Aug</div>
              <p style="margin:0;font-size:14px;line-height:1.75;color:#22242c">Black-and-white conversion for the program cover. Colour version is in the gallery if you prefer it.</p>
              <div style="display:flex;gap:10px">
                <button style="background:#22242c;border:0;border-radius:2px;padding:11px 20px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#f7f5f1">Approve</button>
                <button style="background:none;border:1px solid #d5cfc4;border-radius:2px;padding:11px 20px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#6b6f7d">Request changes</button>
              </div>
            </div>
          </div>
        </div>` : ""}

        ${state.tab === "invoice" ? `
        <div style="max-width:640px;display:flex;flex-direction:column;gap:24px">
          <h1 style="margin:0;font-family:'Bodoni Moda',serif;font-weight:300;font-size:38px;letter-spacing:.03em;color:#22242c">Invoice 2026-114</h1>
          <div style="background:#fff;border:1px solid #ddd7cc">
            <div style="display:flex;justify-content:space-between;padding:16px 22px;border-bottom:1px solid #eee8dd;font-size:14px;color:#22242c"><span>Event coverage &mdash; homecoming, full game</span><span>$450.00</span></div>
            <div style="display:flex;justify-content:space-between;padding:16px 22px;border-bottom:1px solid #eee8dd;font-size:14px;color:#22242c"><span>Additional retouching &mdash; 12 frames</span><span>$180.00</span></div>
            <div style="display:flex;justify-content:space-between;padding:16px 22px;border-bottom:1px solid #eee8dd;font-size:14px;color:#22242c"><span>Program licence &mdash; one season</span><span>$150.00</span></div>
            <div style="display:flex;justify-content:space-between;padding:18px 22px;font-family:'Bodoni Moda',serif;font-size:20px;color:#22242c"><span>Balance due</span><span>$780.00</span></div>
          </div>
          <div style="display:flex;gap:10px;align-items:center">
            <button style="background:#22242c;border:0;border-radius:2px;padding:14px 26px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#f7f5f1">Pay invoice</button>
            <button style="background:none;border:1px solid #d5cfc4;border-radius:2px;padding:14px 22px;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#6b6f7d">Download PDF</button>
            <span style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#a9a49a">Due 30 Aug</span>
          </div>
        </div>` : ""}
      </main>
    </div>
  </div>`;
}

function renderClient() {
  return `
  <div style="min-height:calc(100vh - 96px);background:#f7f5f1;animation:vfade .4s ease both">
    ${state.loggedIn ? renderClientDashboard() : renderClientLogin()}
  </div>`;
}

function renderShop() {
  const sel = PHOTOS[state.sel];
  const items = PHOTOS.map((s, i) => `
        <div style="display:flex;flex-direction:column;gap:11px">
          <button data-action="pickShopItem" data-idx="${i}" style="border:0;padding:0;background:#e6e0d5;display:block;cursor:pointer"><img src="${s.src}" alt="${s.title}" style="width:100%;aspect-ratio:4/5;object-fit:cover;display:block"></button>
          <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px">
            <span style="font-family:'Bodoni Moda',serif;font-size:17px;color:#22242c">${s.title}</span>
            <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#6b6f7d">${s.price}</span>
          </div>
          <div style="font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#a9a49a">${s.meta}</div>
        </div>`).join("");

  const sizeBtn = (option, price, label) => `<button data-action="pickSize" data-option="${option}" data-price="${price}" class="hover-border-dark" style="border:1px solid ${state.option === option ? "#22242c" : "#d5cfc4"};background:none;padding:9px 14px;font-size:12px;color:#22242c">${label}</button>`;

  return `
  <div style="min-height:calc(100vh - 96px);background:#f7f5f1;animation:vfade .4s ease both">
    <header style="display:flex;justify-content:space-between;align-items:center;padding:22px 40px;border-bottom:1px solid #ddd7cc">
      <div style="display:flex;align-items:baseline;gap:16px">
        <button data-action="goSite" style="background:none;border:0;padding:0;font-family:'Bodoni Moda',serif;font-size:14px;letter-spacing:.3em;text-transform:uppercase;color:#22242c">Celeste</button>
        <span style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#a9a49a">Prints &amp; licences</span>
      </div>
      <div style="display:flex;gap:14px;align-items:center">
        <button data-action="goSite" style="background:none;border:0;padding:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#6b6f7d">Back to site</button>
        <div style="display:flex;align-items:center;gap:9px;border:1px solid #d5cfc4;border-radius:2px;padding:8px 15px;font-size:12px;color:#22242c">Cart <span style="background:#22242c;color:#f7f5f1;border-radius:9px;padding:1px 8px;font-size:11px">${state.cart}</span><span style="color:#a9a49a">${state.cartTotal}</span></div>
      </div>
    </header>

    <div style="display:grid;grid-template-columns:1fr 400px;gap:0;align-items:start">
      <div style="padding:32px 40px 70px">
        <h1 style="margin:0 0 8px;font-family:'Bodoni Moda',serif;font-weight:300;font-size:44px;letter-spacing:.03em;color:#22242c">Open editions</h1>
        <p style="margin:0 0 28px;font-size:13.5px;line-height:1.7;color:#6b6f7d;max-width:520px;text-wrap:pretty">Archival pigment prints on cotton rag, signed and shipped from Louisville. Digital files are licensed for editorial or personal use.</p>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px">${items}</div>
      </div>

      <aside style="border-left:1px solid #ddd7cc;padding:32px 34px 60px;background:#fff;position:sticky;top:0;display:flex;flex-direction:column;gap:20px">
        <div style="font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:#a9a49a">Selected</div>
        <img src="${sel.src}" alt="${sel.title}" style="width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:#e6e0d5">
        <h2 style="margin:0;font-family:'Bodoni Moda',serif;font-weight:300;font-size:26px;letter-spacing:.02em;color:#22242c">${sel.title}</h2>
        <p style="margin:0;font-size:13px;line-height:1.7;color:#6b6f7d">${sel.note}</p>
        <div style="display:flex;flex-direction:column;gap:9px">
          <div style="font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#a9a49a">Print size</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            ${sizeBtn("8×10 print", "$60", "8&times;10 &middot; $60")}
            ${sizeBtn("16×20 print", "$145", "16&times;20 &middot; $145")}
            ${sizeBtn("24×30 print", "$290", "24&times;30 &middot; $290")}
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:9px">
          <div style="font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#a9a49a">Or licence the file</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            ${sizeBtn("Personal licence", "$35", "Personal &middot; $35")}
            ${sizeBtn("Editorial licence", "$180", "Editorial &middot; $180")}
          </div>
        </div>
        <div style="padding:14px 16px;background:#f7f5f1;border:1px solid #ddd7cc;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#22242c">
          <span>${state.option}</span><span style="font-family:'JetBrains Mono',monospace">${state.optionPrice}</span>
        </div>
        <button data-action="addToCart" style="background:#22242c;border:0;border-radius:2px;padding:15px;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:#f7f5f1;font-weight:500">Add to cart</button>
        <div style="font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.1em;line-height:1.9;color:#a9a49a">Prints ship in 5&ndash;7 days<br>Files delivered instantly after checkout</div>
      </aside>
    </div>
  </div>`;
}

function renderAdmin() {
  const presetCard = (action, key, photo, label, desc) => `
        <button data-action="${action}" class="hover-border-gold" style="text-align:left;background:#181a20;border:1px solid ${state.preset === key ? "#d4af37" : "#2a2d36"};padding:0;overflow:hidden;display:flex;flex-direction:column">
          <img src="${photo}" alt="" style="width:100%;height:104px;object-fit:cover;display:block;${key === "ethereal" ? "filter:saturate(.8)" : ""}">
          <span style="padding:14px 15px;display:flex;flex-direction:column;gap:6px">
            <span style="display:flex;align-items:center;gap:8px;font-size:14px;color:#f0f2f5">
              ${state.preset === key ? `<span style="width:7px;height:7px;border-radius:50%;background:#d4af37;display:inline-block"></span>` : ""}
              ${label}
            </span>
            <span style="font-size:11.5px;line-height:1.6;color:#9ba3af">${desc}</span>
          </span>
        </button>`;

  const sectionToggle = (action, label, on) => `<button data-action="${action}" style="width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #2a2d36;padding:15px 18px;display:flex;justify-content:space-between;align-items:center;color:#f0f2f5;font-size:13.5px">${label} <span style="font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#d4af37">${on ? "Shown" : "Hidden"}</span></button>`;

  return `
  <div style="min-height:calc(100vh - 96px);background:#0f1115;color:#f0f2f5;animation:vfade .4s ease both">
    <header style="display:flex;justify-content:space-between;align-items:center;padding:20px 40px;border-bottom:1px solid #2a2d36">
      <div style="display:flex;align-items:baseline;gap:14px">
        <span style="font-family:'Bodoni Moda',serif;font-size:14px;letter-spacing:.3em;text-transform:uppercase">Celeste</span>
        <span style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;color:#9ba3af">CMS ADMIN / APPEARANCE</span>
      </div>
      <div style="display:flex;gap:12px;align-items:center">
        <span style="font-size:12.5px;color:#9ba3af">ezra@readyaimgo.biz</span>
        <button data-action="goSite" style="background:none;border:1px solid #2a2d36;border-radius:3px;padding:8px 15px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9ba3af">Preview site</button>
      </div>
    </header>

    <div style="max-width:1120px;margin:0 auto;padding:38px 40px 70px;display:flex;flex-direction:column;gap:34px">
      <div style="display:flex;flex-direction:column;gap:9px">
        <h1 style="margin:0;font-family:'Bodoni Moda',serif;font-weight:300;font-size:40px;letter-spacing:.03em">Front-end appearance</h1>
        <p style="margin:0;font-size:14px;line-height:1.7;color:#9ba3af;max-width:640px;text-wrap:pretty">Choose what visitors see. The change publishes to everyone immediately — no rebuild, no redeploy.</p>
      </div>

      <div style="display:flex;flex-direction:column;gap:14px">
        <div style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#d4af37">Layout preset</div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px">
          ${presetCard("setEthereal", "ethereal", PHOTOS[0].src, "Editorial", "Serif wordmark, numbered index, slate work panel. Best for booking enquiries.")}
          ${presetCard("setCinematic", "cinematic", PHOTOS[2].src, "Cinematic", "One full-bleed frame at a time, dark chrome, gold accents. Best for impact.")}
          ${presetCard("setArchive", "archive", PHOTOS[3].src, "Archive", "Dense grid with filters and frame references. Best for deep browsing and print sales.")}
          ${presetCard("setPortal", "portal", PHOTOS[4].src, "Portal", "One image, the name, one line. Best between projects or during a campaign.")}
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:34px">
        <div style="display:flex;flex-direction:column;gap:14px">
          <div style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#d4af37">Sections shown to visitors</div>
          <div style="background:#181a20;border:1px solid #2a2d36">
            ${sectionToggle("toggleAbout", "About / bio", state.about)}
            ${sectionToggle("toggleServices", "Services &amp; pricing", state.services)}
            <button data-action="toggleShop" style="width:100%;text-align:left;background:none;border:0;padding:15px 18px;display:flex;justify-content:space-between;align-items:center;color:#f0f2f5;font-size:13.5px">Prints &amp; licences shop <span style="font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#d4af37">${state.shop ? "Shown" : "Hidden"}</span></button>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:14px">
          <div style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#d4af37">Publish</div>
          <div style="background:#181a20;border:1px solid #2a2d36;padding:22px;display:flex;flex-direction:column;gap:16px">
            <div style="font-size:13.5px;line-height:1.7;color:#9ba3af">Live now: <span style="color:#f0f2f5">${LABELS[state.published]}</span><br>Staged: <span style="color:#d4af37">${LABELS[state.preset]}</span></div>
            <button data-action="publish" style="background:#d4af37;border:0;border-radius:3px;padding:14px;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:#0f1115;font-weight:500">Publish to visitors</button>
            <div style="font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.1em;line-height:1.9;color:#6d7480">Writes to site_settings/content<br>Visitors update without reloading</div>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function renderSwitcherBar() {
  const presetDot = (key) => state.preset === key ? `<span style="width:6px;height:6px;border-radius:50%;background:#d4af37;display:inline-block"></span>` : "";
  return `
  <div style="position:fixed;left:0;right:0;bottom:0;z-index:200;display:flex;justify-content:center;padding:0 20px 18px;pointer-events:none">
    <div style="pointer-events:auto;display:flex;align-items:center;gap:6px;background:rgba(15,17,21,.94);backdrop-filter:blur(14px);border:1px solid #2a2d36;border-radius:40px;padding:8px 10px 8px 18px;box-shadow:0 12px 40px rgba(0,0,0,.32);flex-wrap:wrap;justify-content:center">
      <span style="font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#6d7480;padding-right:6px">Preset</span>
      <button data-action="setEthereal" class="hover-bg-dark" style="display:flex;align-items:center;gap:6px;background:none;border:0;border-radius:22px;padding:8px 13px;font-size:12px;color:#e8e6e0">${presetDot("ethereal")}Editorial</button>
      <button data-action="setCinematic" class="hover-bg-dark" style="display:flex;align-items:center;gap:6px;background:none;border:0;border-radius:22px;padding:8px 13px;font-size:12px;color:#e8e6e0">${presetDot("cinematic")}Cinematic</button>
      <button data-action="setArchive" class="hover-bg-dark" style="display:flex;align-items:center;gap:6px;background:none;border:0;border-radius:22px;padding:8px 13px;font-size:12px;color:#e8e6e0">${presetDot("archive")}Archive</button>
      <button data-action="setPortal" class="hover-bg-dark" style="display:flex;align-items:center;gap:6px;background:none;border:0;border-radius:22px;padding:8px 13px;font-size:12px;color:#e8e6e0">${presetDot("portal")}Portal</button>
      <span style="width:1px;height:22px;background:#2a2d36;margin:0 8px"></span>
      <button data-action="goSite" class="hover-bg-dark-text-light" style="background:none;border:0;border-radius:22px;padding:8px 13px;font-size:12px;color:#9ba3af">Public</button>
      <button data-action="goClient" class="hover-bg-dark-text-light" style="background:none;border:0;border-radius:22px;padding:8px 13px;font-size:12px;color:#9ba3af">Client area</button>
      <button data-action="goShop" class="hover-bg-dark-text-light" style="background:none;border:0;border-radius:22px;padding:8px 13px;font-size:12px;color:#9ba3af">Shop</button>
      <button data-action="goAdmin" style="background:#d4af37;border:0;border-radius:22px;padding:8px 15px;font-size:12px;color:#0f1115;font-weight:500">Admin</button>
    </div>
  </div>`;
}

function render() {
  const app = document.getElementById("app");
  let view = "";
  if (state.view === "site") view = renderSite();
  else if (state.view === "client") view = renderClient();
  else if (state.view === "shop") view = renderShop();
  else if (state.view === "admin") view = renderAdmin();

  app.innerHTML = `
    <div style="min-height:100vh;padding-bottom:96px">
      ${view}
      ${renderSwitcherBar()}
    </div>
  `;
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = ACTIONS[el.dataset.action];
  if (action) action(el.dataset);
});

document.addEventListener("submit", (e) => {
  e.preventDefault();
  const el = e.target.closest("[data-action]");
  if (el) {
    const action = ACTIONS[el.dataset.action];
    if (action) action(el.dataset);
  }
});

render();
</script>
</body>
</html>
